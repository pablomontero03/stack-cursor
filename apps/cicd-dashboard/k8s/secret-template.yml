# cicd-dashboard-secret — Template de creación manual
#
# Este secret NO es gestionado por el pipeline de release.
# Debe crearse manualmente UNA VEZ al deployar en un cluster nuevo.
# El pipeline solo actualiza el Deployment y el ConfigMap (no el Secret).
#
# CÓMO CREAR:
#   kubectl -n tools-devops create secret generic cicd-dashboard-secret \
#     --from-literal=AZURE_DEVOPS_PAT="<PAT de Azure DevOps>" \
#     --from-literal=TEAMS_WEBHOOK_URL="<URL del webhook de Teams>"
#
# CÓMO ACTUALIZAR (ej. cuando se rota el PAT):
#   kubectl -n tools-devops create secret generic cicd-dashboard-secret \
#     --from-literal=AZURE_DEVOPS_PAT="<nuevo PAT>" \
#     --from-literal=TEAMS_WEBHOOK_URL="<misma URL>" \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# DÓNDE OBTENER LOS VALORES:
#   - AZURE_DEVOPS_PAT: crear en https://dev.azure.com/Shared-Service-GM/ →
#       User Settings → Personal Access Tokens. Scopes mínimos:
#       Build (Read), Release (Read), Project and Team (Read).
#   - TEAMS_WEBHOOK_URL: webhook del canal Observability-DevOps en Teams.
#       Ver en el canal → Apps → Incoming Webhook.
#
# NOTA: El VG 499 (Produccion-DevOps-cicd-dashboard) también tiene estos valores
# para uso del pipeline, pero el pipeline NO aplica este secret.
#
apiVersion: v1
kind: Secret
metadata:
  name: cicd-dashboard-secret
  namespace: tools-devops
type: Opaque
stringData:
  AZURE_DEVOPS_PAT: "<PAT de Azure DevOps — ver instrucciones arriba>"
  TEAMS_WEBHOOK_URL: "<URL del webhook Teams — ver instrucciones arriba>"
